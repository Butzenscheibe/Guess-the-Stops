<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guess the Stations - Session history">
    <meta name="theme-color" content="#3b82f6">
    <title>Session History - Guess the Stations</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="app-header">
        <div class="app-header-content">
            <div class="brand" data-i18n="game.title">Guess the Stations</div>
            <div class="nav-group">
                <button class="nav-button" type="button" data-href="/index.html" data-i18n="nav.home">Home</button>
                <button class="nav-button nav-button--primary" type="button" data-href="/session-history.html" data-i18n="nav.sessions">Sessions</button>
            </div>
            <div class="app-header-actions">
                <div class="language-select-wrapper">
                    <label for="language-select" data-i18n="language.label">Language</label>
                    <select id="language-select">
                        <option value="en">English</option>
                        <option value="de">Deutsch</option>
                        <option value="fr">Français</option>
                    </select>
                </div>
                <button id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/>
                    </svg>
                    <svg class="moon-icon hidden" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="session-history-wrapper">
        <div class="game-container">
            <div class="page-header">
                <h1 data-i18n="history.title">Session History</h1>
            </div>

            <div class="session-history-actions">
                <div class="session-select-row">
                    <label for="session-history-select" data-i18n="history.select">Select Session</label>
                    <select id="session-history-select">
                        <option value="" data-i18n="history.none">No session available</option>
                    </select>
                    <p class="session-info" id="session-history-info" data-i18n="history.pick">Pick a session to load games.</p>
                </div>
            </div>
        </div>

        <div class="game-container">
            <h2 data-i18n="history.pastGames">Past Games</h2>
            <ul class="session-games-list" id="session-games-list"></ul>
            <p class="empty-state" id="session-empty-state" data-i18n="history.empty">No games loaded yet.</p>
        </div>
    </div>

    <script type="module" src="session-history.js"></script>
</body>
</html>
