services:
  guess-the-stops:
    build: .
    container_name: guess-the-stops
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - DB_PATH_GERMAN=${DB_PATH_GERMAN:-/app/database/german-db}
      - DB_PATH_SWISS=${DB_PATH_SWISS:-/app/database/timetable-gen}
      - DB_PATH_ARCHIVE=${DB_PATH_ARCHIVE:-/app/database/games}
    volumes:
      # Mount the database directory to persist SQLite databases
      - ./database:/app/database
    restart: unless-stopped
    networks:
      - guess-the-stops-network

networks:
  guess-the-stops-network:
    driver: bridge
