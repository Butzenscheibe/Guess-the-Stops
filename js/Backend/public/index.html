    <meta name="author" content="DieButzenscheibe">

    <link rel="canonical" href="https://yourdomain.com/">

    <meta property="og:description" content="Test your knowledge of train stations in Switzerland and Germany! Can you guess all the stations on the line?">
    <meta property="og:image" content="https://yourdomain.com/og-image.png">
    <meta property="og:site_name" content="Guess the Stations">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://yourdomain.com/">
    <meta name="twitter:title" content="Guess the Stations - Train Station Quiz Game">
    <meta name="twitter:description" content="Test your knowledge of train stations in Switzerland and Germany! Can you guess all the stations on the line?">
    <meta name="twitter:image" content="https://yourdomain.com/og-image.png">
    
    <meta name="theme-color" content="#3b82f6">
    <title>Guess the Stations - Train Station Quiz Game</title>
    <link rel="stylesheet" href="./style.css">
    
    <!-- Google Analytics (GA4) -->
    <!-- Replace GA_MEASUREMENT_ID with your actual Google Analytics 4 Measurement ID -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'GA_MEASUREMENT_ID');
    </script>
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Guess the Stations",
        "description": "A fun and educational train station guessing game",
        "url": "https://yourdomain.com/",
        "applicationCategory": "Game",
        "operatingSystem": "Web Browser",
        "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
        },
        "author": {
            "@type": "Person",
            "name": "DieButzenscheibe",
            "url": "https://diebutzenscheibe.dev"
        }
    }
    </script>
</head>
<body>
    <!-- Dark Mode Toggle -->
    <button id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">
        <svg class="sun-icon" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"/>
        </svg>
        <svg class="moon-icon hidden" width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
        </svg>
    </button>
    
    <!-- Main Content Wrapper -->
    <div class="content-wrapper">
        <div class="game-container">
            <h1>Guess the Stations</h1>
            
            <div id="game-setup-1">
                <label for="country-select">Select Country</label>
                <select id="country-select">
                    <option value="ch">Switzerland</option>
                    <option value="de">Germany</option>
                </select>
                <button id="country-button">Continue</button>
            </div>
            
            <div id="game-setup-2" class="hidden">
                <label for="difficulty-select">Select Difficulty</label>
                <select id="difficulty-select">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
                <button id="difficulty-button">Start Game</button>
            </div>
            
            <div id="game-input" class="hidden">
                <label for="user-input">Enter Station Name</label>
                <input type="text" id="user-input" placeholder="Type station name...">
                <div class="button-grid">
                    <button id="submit-button">Submit</button>
                    <button type="button" id="hint">Hint (-20%)</button>
                    <button type="button" id="cancel-button">Cancel</button>
                    <button type="button" id="restart-button">Restart</button>
                    <button type="button" id="share">Share</button>
                    <button type="button" id="save">Save Result</button>
                </div>
            </div>
            
            <div id="save-input" class="hidden">
                <h2>Save Your Result</h2>
                <label for="save-name">Your Name</label>
                <input type="text" id="save-name" placeholder="Enter your name...">
                <button id="save-button">Save Score</button>
            </div>
            
            <div id="game-output" class="hidden">
                <h2 id="train-name">Loading...</h2>
                <div class="stats-grid">
                    <p id="score">Score: --</p>
                    <p id="time">Time: --:--:--</p>
                </div>
                <p id="result">Waiting...</p>
                <ul id="stop-list" class="stop-list"></ul>
            </div>
        </div>
        
        <div class="game-container" id="highscores">
            <h1>Leaderboard</h1>
            <ul id="leaderboard" class="stop-list"></ul>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="app-footer">
        <p><a href="https://diebutzenscheibe.dev" target="_blank" rel="noopener noreferrer">© 2025 DieButzenscheibe</a></p>
    </footer>
    
    <script src="index.js"></script>
</body>
