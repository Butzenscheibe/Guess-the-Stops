<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View shared game results">
    <meta name="theme-color" content="#0a0e1a">
    <title>🏆 Shared Result - Station Guesser</title>
    <link rel="stylesheet" href="./style.css">
    <script src="shared-result.js"></script>
</head>
<body>
    <div class="game-container" id="game-container">
        <h1>🚂 Station Guesser</h1>
        <h2>📊 Game Result</h2>
        <div class="stats-grid">
            <p id="score">🎯 Score: --</p>
            <p id="name">👤 Player: --</p>
        </div>
        <div id="stop-div">
            <div id="guesses">
                <h3>📝 Your Guesses</h3>
                <ul id="stop-list" class="stop-list"></ul>
            </div>
            <div id="correct">
                <h3>✅ Correct Answers</h3>
                <ul id="correct-list" class="stop-list"></ul>
            </div>
        </div>
    </div>
</body>
</html>
