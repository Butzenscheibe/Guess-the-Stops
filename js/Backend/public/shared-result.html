<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="shared-result.js"></script>
    <title>Shared Result</title>
</head>
<body>
    <div class="game-container" id="game-container">
        <h1>Guess the Stations</h1>
        <h2>Ergebnis</h2>
        <p id="score"></p>
        <p id="name"></p>
        <div id="stop-div">
            <div id="guesses">
                <h3>Versuche</h3>
                <ul id="stop-list" class="stop-list">
                </ul>
            </div>
            <div id="correct">
                <h3>Richtige Antworten</h3>
                <ul id="correct-list" class="stop-list">
                </ul>

            </div>
        </div>
    </div>
</body>
</html>
