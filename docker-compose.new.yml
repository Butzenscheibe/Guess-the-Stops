version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guess-the-stops-backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - DB_PATH_GERMAN=/app/database/german-db
      - DB_PATH_SWISS=/app/database/timetable-gen
      - DB_PATH_ARCHIVE=/app/database/games
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
    volumes:
      # Mount the database directory to persist SQLite databases
      - ./database:/app/database
    restart: unless-stopped
    networks:
      - guess-the-stops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: guess-the-stops-frontend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:3000}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - guess-the-stops-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  guess-the-stops-network:
    driver: bridge
