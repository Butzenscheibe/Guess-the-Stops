name: Compose policy

on:
  pull_request:
    paths:
      - docker-compose.yml
      - tests/test_compose_logging.py
      - .github/workflows/compose-policy.yml
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - tests/test_compose_logging.py
      - .github/workflows/compose-policy.yml

permissions:
  contents: read

jobs:
  compose-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Render and validate Compose without building or deploying
        run: python3 -B -m unittest discover -s tests -v
